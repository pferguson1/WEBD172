<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>User Directory</title>
    <link rel="stylesheet" href="responsive.css" type="text/css" />
  </head>

  <body>
    <!-- Header section -->
    <header class="header-container">
      <h1>User Directory</h1>
    </header>

    <div class="searchbox-container">
      <label for="searchBox">Searchbox:</label>
      <input type="text" id="searchBox" placeholder="Search users..." />
    </div>

    <div class="sortButton-container">
      <button id="sortButton">Sort Users A-Z</button>
    </div>

    <div class="clearButton-container">
      <button id="clearButton">Clear</button>
    </div>

    <div class="userlist-wrapper">
      <div class="userlist-container">
        <ul id="userList"></ul>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
