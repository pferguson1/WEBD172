<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courses | Homework3-Express-Server</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="header-container">
      <h1>Available Courses</h1>
      <h3>Fall 2026 Semester</h3>
      <p>Browse all available courses for this semester.</p>
    </div>

    <button id="loadCoursesBtn">Load Courses</button>

    <div id="coursesList"></div>

    <p>
      <a href="/index.html">← Back to Home</a> |
      <a href="/about.html">About</a>
    </p>

    <script>
      const loadBtn = document.getElementById("loadCoursesBtn");
      const coursesList = document.getElementById("coursesList");

      loadBtn.addEventListener("click", async () => {
        try {
          const response = await fetch("/courses");
          const courses = await response.json();

          coursesList.innerHTML = courses
            .map(
              (course) =>
                `<div class="course-item">
                  <h3>${
                    typeof course.title === "object"
                      ? course.title.name
                      : course.title
                  }</h3>
                  <p>ID: ${course.id}</p>
                  ${
                    typeof course.title === "object"
                      ? `<p>${course.title.semester} ${course.title.year}</p>`
                      : "<p>Fall 2026</p>"
                  }
                </div>`,
            )
            .join("");
        } catch (error) {
          coursesList.innerHTML =
            "<p>Error loading courses. Please try again.</p>";
          console.error("Error:", error);
        }
      });
    </script>
  </body>
</html>
