<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Info | Homework3-Express-Server</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="header-container">
      <h1>Student Information</h1>
      <h3>Fall 2026 Semester</h3>
      <p>Enter your name to get a personalized welcome message.</p>
    </div>

    <div class="student-search">
      <input
        type="text"
        id="studentNameInput"
        placeholder="Enter your name"
        class="student-input"
      />
      <button id="searchBtn">Get Welcome Message</button>
    </div>

    <div id="studentInfo"></div>

    <p>
      <a href="/index.html">← Back to Home</a> |
      <a href="/courses.html">Courses</a> |
      <a href="/about.html">About</a>
    </p>

    <script>
      const searchBtn = document.getElementById("searchBtn");
      const studentInput = document.getElementById("studentNameInput");
      const studentInfo = document.getElementById("studentInfo");

      searchBtn.addEventListener("click", async () => {
        const studentName = studentInput.value.trim();

        if (!studentName) {
          studentInfo.innerHTML =
            "<p class='error'>Please enter your name.</p>";
          return;
        }

        try {
          const response = await fetch(
            `/student/${encodeURIComponent(studentName)}`,
          );
          const message = await response.text();

          studentInfo.innerHTML = `
            <div class="student-card">
              <h2>${studentName}</h2>
              <p>${message}</p>
              <p class="semester-info">Fall 2026</p>
            </div>
          `;
        } catch (error) {
          studentInfo.innerHTML =
            "<p class='error'>Error retrieving student information.</p>";
          console.error("Error:", error);
        }
      });

      // Allow Enter key to submit
      studentInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          searchBtn.click();
        }
      });
    </script>
  </body>
</html>
